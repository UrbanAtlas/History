<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History — Barangay Commonwealth</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'VT323', monospace;
    background: #1c1828;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .app {
    max-width: 390px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HERO: actual image as background ── */
  .hero {
    width: 100%;
    height: 390px;
    position: relative;
    flex-shrink: 0;
    overflow: hidden;
    image-rendering: pixelated;
  }

  .hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    image-rendering: pixelated;
    display: block;
  }

  /* Dark gradient overlay so navbar blends in smoothly */
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(28,24,40,0.15) 0%,
      transparent 30%,
      transparent 70%,
      rgba(28,24,40,0.7) 100%
    );
    pointer-events: none;
  }

  /* Bottom fade to match feed bg */
  .hero-fade {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: linear-gradient(180deg, transparent, #1c1828);
    pointer-events: none;
  }

  /* ── STICKY NAV ── */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #1c1828;
    border-bottom: 3px solid #c8783a;
    padding: 8px 12px 7px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 3px 0 #0a0818;
  }

  .navbar-left {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .navbar-brgy {
    font-family: 'VT323', monospace;
    font-size: 13px;
    color: #9a8baa;
    letter-spacing: 0.08em;
  }

  .navbar-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #e8c888;
    text-shadow: 1px 1px 0 #5a3010;
    letter-spacing: 0.04em;
  }

  .navbar-badge {
    font-family: 'VT323', monospace;
    font-size: 14px;
    color: #c8783a;
    background: #2a1838;
    border: 2px solid #c8783a;
    box-shadow: 1px 1px 0 #000;
    padding: 2px 9px;
    letter-spacing: 0.05em;
  }

  /* ── FEED ── */
  .feed {
    padding: 14px 10px 80px;
    display: flex;
    flex-direction: column;
  }

  /* ── DECADE MARKER ── */
  .decade-marker {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 2px 6px;
    opacity: 0;
    animation: pop 0.3s steps(3) forwards;
  }

  .decade-badge {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: #f0e8d0;
    background: #7a3020;
    padding: 4px 10px;
    border: 2px solid #e8b870;
    box-shadow: 2px 2px 0 #000;
    white-space: nowrap;
    text-shadow: 1px 1px 0 #3a0800;
  }

  .decade-line {
    flex: 1;
    height: 2px;
    background: repeating-linear-gradient(
      90deg,
      #c8783a 0px, #c8783a 5px,
      transparent 5px, transparent 9px
    );
  }

  /* ── ENTRY ── */
  .entry {
    display: flex;
    opacity: 0;
    animation: pop 0.3s steps(3) forwards;
  }

  @keyframes pop {
    0%   { opacity: 0; transform: translateY(8px); }
    50%  { opacity: 0.5; transform: translateY(3px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .entry:nth-child(1)  { animation-delay: 0.05s; }
  .entry:nth-child(2)  { animation-delay: 0.10s; }
  .entry:nth-child(3)  { animation-delay: 0.15s; }
  .entry:nth-child(4)  { animation-delay: 0.20s; }
  .entry:nth-child(5)  { animation-delay: 0.25s; }
  .entry:nth-child(6)  { animation-delay: 0.30s; }
  .entry:nth-child(7)  { animation-delay: 0.35s; }
  .entry:nth-child(8)  { animation-delay: 0.40s; }
  .entry:nth-child(9)  { animation-delay: 0.45s; }
  .entry:nth-child(10) { animation-delay: 0.50s; }
  .entry:nth-child(11) { animation-delay: 0.55s; }
  .entry:nth-child(12) { animation-delay: 0.60s; }
  .entry:nth-child(13) { animation-delay: 0.65s; }
  .entry:nth-child(14) { animation-delay: 0.70s; }
  .entry:nth-child(15) { animation-delay: 0.75s; }
  .entry:nth-child(16) { animation-delay: 0.80s; }
  .entry:nth-child(17) { animation-delay: 0.85s; }
  .entry:nth-child(18) { animation-delay: 0.90s; }

  /* ── SPINE ── */
  .spine {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 28px;
    flex-shrink: 0;
    padding-top: 18px;
  }

  .spine-dot {
    width: 10px;
    height: 10px;
    border: 2px solid #f0e8d0;
    box-shadow: 1px 1px 0 #000;
    flex-shrink: 0;
    z-index: 1;
    transition: transform 0.1s steps(2);
    image-rendering: pixelated;
  }

  .entry[data-type="Event"]     .spine-dot { background: #c85840; }
  .entry[data-type="Figure"]    .spine-dot { background: #5a9858; }
  .entry[data-type="Narrative"] .spine-dot { background: #8870c0; }
  .entry:hover .spine-dot { transform: scale(1.5); }

  .spine-line {
    width: 2px;
    flex: 1;
    min-height: 16px;
    background: repeating-linear-gradient(
      180deg,
      #c8783a 0, #c8783a 3px,
      #2a1838 3px, #2a1838 7px
    );
  }

  .entry:last-child .spine-line { display: none; }

  /* ── CARD ── */
  .card {
    flex: 1;
    margin: 6px 0 10px 2px;
    cursor: pointer;
    transition: transform 0.08s steps(2);
  }

  .card:active { transform: translate(2px, 2px); }

  .card-inner {
    border: 3px solid #e8c888;
    box-shadow: 3px 3px 0 #000, inset 0 0 0 1px rgba(232,200,136,0.15);
    overflow: hidden;
  }

  /* Banner colors pulled from image palette */
  .card-banner {
    padding: 7px 10px 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid rgba(0,0,0,0.5);
  }

  .entry[data-type="Event"]     .card-banner { background: #6b3028; }
  .entry[data-type="Figure"]    .card-banner { background: #2a4a28; }
  .entry[data-type="Narrative"] .card-banner { background: #3a2858; }

  .card-year {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: #f0e8d0;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.6);
    line-height: 1;
  }

  .card-tag {
    font-family: 'VT323', monospace;
    font-size: 15px;
    color: #f0e8d0;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(240,232,208,0.35);
    padding: 1px 8px;
    letter-spacing: 0.06em;
  }

  /* Card body uses image's dark purple-slate tone */
  .card-body {
    padding: 10px 10px 9px;
    background: #221c30;
  }

  .card-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: #e8c888;
    line-height: 1.85;
    margin-bottom: 9px;
    text-shadow: 1px 1px 0 #000;
  }

  /* Description panel — warm sandstone tone from image's ground */
  .card-panel {
    background: #2e2440;
    border: 2px solid #c8783a;
    box-shadow: inset 1px 1px 0 rgba(200,120,58,0.18), inset -1px -1px 0 rgba(0,0,0,0.5);
    padding: 8px 9px;
    margin-bottom: 8px;
    position: relative;
  }

  /* Corner diamonds like the image's decorative details */
  .card-panel::before,
  .card-panel::after {
    content: '◆';
    position: absolute;
    font-size: 8px;
    color: #c8783a;
    line-height: 1;
    opacity: 0.8;
  }
  .card-panel::before { top: 2px; left: 3px; }
  .card-panel::after  { bottom: 2px; right: 3px; }

  .card-desc {
    font-family: 'VT323', monospace;
    font-size: 15px;
    line-height: 1.55;
    color: #c8b898;
  }

  .card-desc.collapsed {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Pixel button — warm amber from the kalesa/carriage color */
  .btn-more {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: #1c1828;
    background: #e8b870;
    border: 2px solid #f0e8d0;
    box-shadow: 2px 2px 0 #000;
    padding: 5px 9px;
    cursor: pointer;
    display: inline-block;
    margin-bottom: 9px;
    transition: transform 0.05s steps(1), box-shadow 0.05s steps(1);
    user-select: none;
    text-shadow: none;
  }

  .btn-more:active {
    transform: translate(2px, 2px);
    box-shadow: 0 0 0 #000;
  }

  .card-footer {
    border-top: 1px solid rgba(200,120,58,0.3);
    padding-top: 7px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .card-emoji { font-size: 14px; }

  .card-foot-txt {
    font-family: 'VT323', monospace;
    font-size: 13px;
    color: #7868a8;
    letter-spacing: 0.04em;
  }

  /* ── BOTTOM BAR ── */
  .bottombar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 390px;
    background: #1c1828;
    border-top: 3px solid #c8783a;
    padding: 7px 16px;
    z-index: 100;
    text-align: center;
    box-shadow: 0 -2px 0 #000;
  }

  .bottombar span {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: #c8783a;
    letter-spacing: 0.12em;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #1c1828; }
  ::-webkit-scrollbar-thumb {
    background: #c8783a;
    border: 1px solid #e8c888;
  }
</style>
</head>
<body>
<div class="app">

  <!-- HERO: actual image -->
  <div class="hero">
   <img class="hero-img" src="hero.jpg" alt="History — Barangay Commonwealth"/>
  </div>

  <!-- STICKY NAV -->
  <div class="navbar">
    <div class="navbar-left">
      <span class="navbar-brgy">📍 Brgy. Commonwealth · QC</span>
      <span class="navbar-title">KASAYSAYAN</span>
    </div>
    <span class="navbar-badge" id="cnt">18 ENTRIES</span>
  </div>

  <!-- FEED -->
  <div class="feed" id="feed"></div>

  <div class="bottombar">
    <span>◆ URBAN ATLAS ◆ HISTORY ◆</span>
  </div>
</div>

<script>
const entries = [
  { year: 1950, type: "Event",     emoji: "🏛️", title: "Establishment of Barangay Commonwealth",
    desc: "Barangay Commonwealth was officially established as one of the barangays of Quezon City, named after Commonwealth Avenue — the grand boulevard built during the Philippine Commonwealth era. Early settlers came from nearby provinces, drawn by the promise of land and opportunity near the new capital." },
  { year: 1954, type: "Narrative", emoji: "📜", title: "Early Life Along the Avenue",
    desc: "Residents recall the early 1950s as a quiet, rural time. Farmlands and nipa huts dotted the landscape. Carabaos were still used to plow fields where subdivisions now stand. Neighbors knew each other by name, and community life revolved around the local chapel and the elementary school." },
  { year: 1958, type: "Figure",    emoji: "👤", title: "Kapitan Gregorio Santos",
    desc: "The first recorded Barangay Captain of Commonwealth, Kapitan Santos served from 1958 to 1967. Known for walking the streets each morning to check on constituents, he successfully petitioned the city for the first concrete road segment connecting the barangay to the main avenue." },
  { year: 1963, type: "Event",     emoji: "🏫", title: "Commonwealth Elementary School Founded",
    desc: "The establishment of Commonwealth Elementary School gave the barangay its first permanent public school. Classes initially ran in makeshift classrooms before the first concrete building was completed in 1966. The school remains a cornerstone of the community today." },
  { year: 1965, type: "Narrative", emoji: "📜", title: "The Great Flood of '65",
    desc: "Old-timers still speak of the massive flood of 1965 that submerged much of the barangay for three days. With Batasan Hills still undeveloped, rainwater had no drainage outlet. Neighbors rescued each other on improvised wooden rafts. The disaster united the community and triggered the first major drainage petition to city hall." },
  { year: 1972, type: "Event",     emoji: "🗓️", title: "Martial Law and the Barangay System",
    desc: "Under Martial Law, the traditional barrio system was reorganized into barangays under Presidential Decree 557. Commonwealth formally adopted the new barangay governance structure — Barangay Captain, Kagawads, and Lupong Tagapamayapa — replacing older local structures." },
  { year: 1978, type: "Event",     emoji: "🏛️", title: "Opening of Batasang Pambansa Complex",
    desc: "The inauguration of the Batasang Pambansa Complex on Commonwealth Avenue brought enormous change. The influx of government workers, vendors, and laborers transformed the neighborhood overnight. New carinderia rows, sari-sari stores, and jeepney routes appeared, and Commonwealth became a major urban corridor." },
  { year: 1982, type: "Figure",    emoji: "👤", title: "Teacher Lydia Manalo",
    desc: "A beloved teacher at Commonwealth Elementary for over 30 years, Teacher Lydia is credited with educating thousands of residents. She self-funded a literacy program for out-of-school youth that ran for a decade, and in 1982 was recognized by Quezon City with its first Natatanging Guro award." },
  { year: 1986, type: "Narrative", emoji: "📜", title: "People Power Echoes in Commonwealth",
    desc: "During the EDSA People Power Revolution, Commonwealth Avenue was a major artery for civilians and military defectors alike. Residents opened their homes to marchers, providing food and water. Many elders recall watching tanks roll down the avenue — feeling their barangay was at the center of history." },
  { year: 1993, type: "Event",     emoji: "🏥", title: "Barangay Health Center Inaugurated",
    desc: "After years of advocacy by the Barangay Council, the Commonwealth Health Center opened in 1993, providing free consultations, immunizations, and maternal care. It dramatically reduced infant mortality in the area and still serves thousands of residents annually." },
  { year: 1998, type: "Event",     emoji: "🛒", title: "Commonwealth Market Expansion",
    desc: "The Commonwealth Public Market underwent a major expansion, doubling stall capacity and modernizing sanitation infrastructure. It became one of the largest wet markets in Quezon City, serving not just Commonwealth but multiple neighboring barangays." },
  { year: 2003, type: "Narrative", emoji: "📜", title: "The Highway of Death",
    desc: "By the early 2000s, Commonwealth Avenue had earned the grim nickname 'Highway of Death' due to its high accident rate. Residents organized road safety campaigns and pushed for pedestrian overpasses and better streetlighting — advocacy that eventually moved local government to act." },
  { year: 2009, type: "Event",     emoji: "🌧️", title: "Typhoon Ondoy Devastates the Barangay",
    desc: "Typhoon Ondoy caused catastrophic flooding across Metro Manila in September 2009. Parts of Barangay Commonwealth were submerged for days. The barangay mobilized rescue using rubber boats, and the disaster accelerated plans for a community disaster preparedness committee." },
  { year: 2013, type: "Event",     emoji: "🚇", title: "MRT-7 Station Groundbreaking",
    desc: "The groundbreaking for the MRT Line 7 station at Commonwealth Avenue marked a new era of connectivity. The project promised to link residents directly to North EDSA, offering hope to commuters enduring daily gridlock on one of Metro Manila's most congested roads." },
  { year: 2018, type: "Figure",    emoji: "👤", title: "Barangay Captain Maria Santos",
    desc: "Elected in 2018, Captain Maria Santos became the first female Barangay Captain of Commonwealth. Her term focused on anti-drug campaigns, expanded livelihood programs, a CCTV network covering major intersections, and the barangay's first free WiFi hubs for residents." },
  { year: 2020, type: "Narrative", emoji: "📜", title: "COVID-19 and Bayanihan Spirit",
    desc: "The COVID-19 pandemic brought lockdowns and hardship to the barangay. The Council mobilized food packs and ayuda distributions. Residents formed community pantries — sidewalk shelves where neighbors could leave or take food freely — a symbol of the barangay's enduring bayanihan spirit." },
  { year: 2024, type: "Event",     emoji: "🛣️", title: "Commonwealth Avenue Road Widening Completed",
    desc: "After years of construction, the Commonwealth Avenue road widening project reached completion. Additional lanes, rehabilitated sidewalks, and improved drainage transformed the corridor. Combined with ongoing MRT-7 works, the avenue is being repositioned as a modern urban transit spine for northern QC." },
  { year: 2026, type: "Narrative", emoji: "🌟", title: "Commonwealth Today",
    desc: "Barangay Commonwealth stands as one of the most populous and dynamic barangays in Quezon City. From quiet farming roots in the 1950s to a thriving urban community, its story is one of resilience, bayanihan, and growth — written in the lives of every family that calls it home." },
];

function decade(y) { return Math.floor(y/10)*10; }

function build() {
  const feed = document.getElementById('feed');
  document.getElementById('cnt').textContent = entries.length + ' ENTRIES';
  let last = null;

  entries.forEach((e, i) => {
    const d = decade(e.year);
    if (d !== last) {
      const dm = document.createElement('div');
      dm.className = 'decade-marker';
      dm.innerHTML = `<div class="decade-badge">${d}s</div><div class="decade-line"></div>`;
      feed.appendChild(dm);
      last = d;
    }

    const el = document.createElement('div');
    el.className = 'entry';
    el.setAttribute('data-type', e.type);
    el.innerHTML = `
      <div class="spine">
        <div class="spine-dot"></div>
        <div class="spine-line"></div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-banner">
            <span class="card-year">${e.year}</span>
            <span class="card-tag">${e.emoji} ${e.type.toUpperCase()}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${e.title}</div>
            <div class="card-panel">
              <div class="card-desc collapsed" id="d${i}">${e.desc}</div>
            </div>
            <button class="btn-more" id="b${i}" onclick="toggle(${i})">▶ READ MORE</button>
            <div class="card-footer">
              <span class="card-emoji">${e.emoji}</span>
              <span class="card-foot-txt">Brgy. Commonwealth · ${e.year}</span>
            </div>
          </div>
        </div>
      </div>
    `;
    feed.appendChild(el);
  });
}

function toggle(i) {
  const d = document.getElementById('d'+i);
  const b = document.getElementById('b'+i);
  const c = d.classList.toggle('collapsed');
  b.textContent = c ? '▶ READ MORE' : '▼ READ LESS';
}

build();
</script>
</body>
</html>
